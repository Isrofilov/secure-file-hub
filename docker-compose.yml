services:
  securefilehub:
    build: .
    # image: isrofilov/secure-file-hub:latest
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    environment:
      # All settings are optional, see README.md
      - TOTP_SECRET=          # generated and saved to uploads/.securefilehub on first start
      - BACKUP_CODES=         # e.g. 7fk2-9qpm-x3va,c8d1-mm4z-2k7w (each works once)
      - TIMEZONE=Europe/Moscow
      - SECURE_COOKIES=false  # set to true when the site is served over HTTPS
      - TRUSTED_PROXIES=0     # number of reverse proxies in front of the app
      # - MAX_UPLOAD_SIZE_MB=0
      # - DOMAIN=yourdomain.com
      # - UPLOAD_DOMAIN=upload.yourdomain.com
    restart: unless-stopped
